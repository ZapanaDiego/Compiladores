<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LexLP - Fase 1: Lectura + Números</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #89b4fa;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        .container {
            display: flex;
            gap: 20px;
            height: calc(100vh - 120px);
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            background: #313244;
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            color: #89b4fa;
        }
        textarea {
            flex: 1;
            background: #181825;
            color: #cdd6f4;
            border: 1px solid #45475a;
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 15px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        textarea:focus {
            border-color: #89b4fa;
        }
        .results {
            flex: 1;
            background: #181825;
            border: 1px solid #45475a;
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
        }
        .btn-container {
            text-align: center;
            margin-top: 15px;
        }
        button {
            background: #89b4fa;
            color: #1e1e2e;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #74c7ec;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        th {
            background: #313244;
            color: #89b4fa;
            padding: 8px 10px;
            text-align: left;
            font-size: 12px;
        }
        td {
            padding: 6px 10px;
            border-bottom: 1px solid #313244;
            font-size: 12px;
        }
        .section-title {
            color: #a6e3a1;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .error-row td {
            color: #f38ba8;
        }
        .token-type {
            font-weight: bold;
        }
        .token-kw { color: #cba6f7; }
        .token-id { color: #89dceb; }
        .token-str { color: #a6e3a1; }
        .token-num { color: #fab387; }
        .no-items {
            color: #6c7086;
            font-style: italic;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>🔍 LexLP - Analizador Léxico</h1>

    <div class="container">
        <div class="panel">
            <div class="panel-header">📝 Código Fuente</div>
            <textarea id="sourceCode" placeholder="Escribe tu código aquí...">let mensaje = "Hola Mundo\n"
if contador >= 10.5 {
    print(mensaje)
    int total = 42
}</textarea>
        </div>

        <div class="panel">
            <div class="panel-header">📊 Resultados del Análisis</div>
            <div class="results" id="results">
                <p class="no-items">Presiona "Analizar" para ver los resultados.</p>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button onclick="runAnalysis()">⚡ Analizar</button>
    </div>

    <script>
        function runAnalysis() {
            const code = document.getElementById('sourceCode').value;
            window.ipc.postMessage(code);
        }

        function getTokenClass(type) {
            if (type.startsWith('KW_')) return 'token-kw';
            if (type === 'ID') return 'token-id';
            if (type === 'STRING') return 'token-str';
            if (type.startsWith('NUM_')) return 'token-num';
            return '';
        }

        // This function will be called from Rust with the JSON result
        function showResults(jsonStr) {
            const data = JSON.parse(jsonStr);
            const resultsDiv = document.getElementById('results');
            let html = '';

            // Tokens table
            html += '<div class="section-title">✅ Tokens (' + data.tokens.length + ')</div>';
            if (data.tokens.length > 0) {
                html += '<table><tr><th>#</th><th>Tipo</th><th>Lexema</th><th>Línea</th><th>Columna</th></tr>';
                data.tokens.forEach((t, idx) => {
                    const cls = getTokenClass(t.type);
                    html += '<tr><td>' + (idx + 1) + '</td>'
                         + '<td class="token-type ' + cls + '">' + t.type + '</td>'
                         + '<td><code>' + escapeHtml(t.lexeme) + '</code></td>'
                         + '<td>' + t.line + '</td>'
                         + '<td>' + t.col + '</td></tr>';
                });
                html += '</table>';
            } else {
                html += '<p class="no-items">No se encontraron tokens.</p>';
            }

            // Errors table
            html += '<div class="section-title" style="color:#f38ba8;">❌ Errores (' + data.errors.length + ')</div>';
            if (data.errors.length > 0) {
                html += '<table><tr><th>#</th><th>Lexema</th><th>Línea</th><th>Columna</th><th>Mensaje</th></tr>';
                data.errors.forEach((e, idx) => {
                    html += '<tr class="error-row"><td>' + (idx + 1) + '</td>'
                         + '<td><code>' + escapeHtml(e.lexeme) + '</code></td>'
                         + '<td>' + e.line + '</td>'
                         + '<td>' + e.col + '</td>'
                         + '<td>' + escapeHtml(e.message) + '</td></tr>';
                });
                html += '</table>';
            } else {
                html += '<p class="no-items">No se encontraron errores.</p>';
            }

            resultsDiv.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
